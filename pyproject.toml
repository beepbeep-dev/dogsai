[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogsai"
version = "0.1.0"
description = "Dog behaviour recognition from video — an efficient spatio-temporal CNN written from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["video", "action-recognition", "animal-behaviour", "pytorch", "dogs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "av>=10.0",
]

[project.optional-dependencies]
# OpenCV powers the fast resize path, the synthetic renderer and overlay text.
full = ["opencv-python-headless>=4.8", "tqdm>=4.65", "huggingface_hub>=0.20", "PyYAML>=6.0"]
dev = ["pytest>=7.4", "pytest-timeout>=2.2", "ruff>=0.4"]

[project.scripts]
dogsai = "dogsai.cli:main"

[tool.setuptools.packages.find]
include = ["dogsai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:dogsai.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are mostly prose in docstrings
    "B008",    # argparse/dataclass defaults
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
